# Opens the dashboard in headless Chromium before anything publishes: every PR (the intake's
# data.js PRs included) and every push to main. See tools/smoke.mjs for what fails the check.
# No secrets and no deploy step; GitHub Pages still publishes main as before.
name: Dashboard smoke check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Dashboard smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Playwright and headless Chromium
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.63.0
          npx playwright install --with-deps --only-shell chromium

      - name: Open every tab at 1280x900 and 375x812
        run: node tools/smoke.mjs --out smoke-screenshots

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-screenshots
          path: smoke-screenshots/
          if-no-files-found: warn
          retention-days: 30
